[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padroes"
version = "1.0.0"
description = "Permutacoes que evitam um padrao, varridas uma a uma: as classes de Wilf descobertas pela contagem, com Catalan e as simetrias como juizes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
padroes = "padroes.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["padroes*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
